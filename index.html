<style>
:root{ --bg:#F7F4EE; --paper:#FFFDF9; --ink:#1F1D1A; --mute:#857D73; --line:#DED8CC; --momiji:#C8502E; color-scheme:light }
*{ box-sizing:border-box } html,body{ height:100%; margin:0 }
body{ background:radial-gradient(120% 70% at 50% 0%, rgba(217,164,65,.10), transparent 60%), radial-gradient(90% 60% at 50% 100%, rgba(200,80,46,.09), transparent 65%), linear-gradient(180deg,#FBF9F4 0%,#F7F4EE 50%,#EEE6D8 100%); color:var(--ink); font-family:"Zen Kaku Gothic New","Noto Sans TC",system-ui,sans-serif; -webkit-font-smoothing:antialiased }
#gate{ min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 32px); opacity:0; transition:opacity .25s }
#gate.show{ opacity:1 }
.mark{ width:34px; height:34px; color:var(--momiji) }
h1{ font-family:"Zen Old Mincho","Noto Serif TC",serif; font-weight:600; font-size:40px; letter-spacing:.14em; margin:18px 0 0 .14em; line-height:1.1 }
.en{ font-size:11.5px; letter-spacing:.28em; color:var(--mute); margin-top:12px; text-transform:uppercase }
.rule{ width:56px; height:1px; background:var(--momiji); margin:28px auto 30px }
form{ width:100%; max-width:300px; display:flex; flex-direction:column; align-items:center; gap:14px }
input{ width:100%; font:inherit; font-size:16px; letter-spacing:.12em; text-align:center; padding:12px 18px; border-radius:999px; border:1px solid var(--line); background:var(--paper); color:var(--ink); outline:none }
input:focus{ border-color:var(--ink) }
button{ font:inherit; font-size:14px; letter-spacing:.14em; padding:11px 34px 11px calc(34px + .14em); border-radius:999px; border:1.5px solid var(--ink); background:none; color:var(--ink); cursor:pointer }
button:disabled{ opacity:.5 }
.msg{ min-height:20px; font-size:12.5px; letter-spacing:.08em; color:var(--momiji) }
.hint{ font-size:11px; letter-spacing:.14em; color:var(--mute); margin-top:6px }
</style>

// password validity: 12 h while in Japan (11/5–11/9 by the phone's date), 15 min before and after
const now0 = new Date(), inTrip = now0 >= new Date(2026,10,5) && now0 < new Date(2026,10,10);
const TTL = inTrip ? 12*60*60*1000 : 15*60*1000;
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const gate = document.getElementById('gate'), f = document.getElementById('f'), pw = document.getElementById('pw'), b = document.getElementById('b'), msg = document.getElementById('msg');
async function derive(pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(P.s), iterations:P.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function open(key){
  if(document.readyState==='loading') await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.i)}, key, u8(P.c));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
(async () => {
  try{
    const saved = JSON.parse(localStorage.getItem('kk')||'null');
    if(saved && Date.now() - saved.t < TTL){ const key = await crypto.subtle.importKey('raw', u8(saved.k), 'AES-GCM', true, ['decrypt']); await open(key); return; }
    if(saved) localStorage.removeItem('kk');
  }catch(e){ try{ localStorage.removeItem('kk') }catch(_){} }
  document.getElementById('hint').textContent = inTrip ? '旅途中：每 12 小時需重新輸入' : '每 15 分鐘需重新輸入';
  gate.classList.add('show'); pw.focus();
})();
f.addEventListener('submit', async e => {
  e.preventDefault(); if(!pw.value) return;
  b.disabled = true; msg.textContent = '';
  try{
    const key = await derive(pw.value);
    const raw = await crypto.subtle.exportKey('raw', key);
    await open(key);
    try{ localStorage.setItem('kk', JSON.stringify({k:btoa(String.fromCharCode(...new Uint8Array(raw))), t:Date.now()})) }catch(_){}
  }catch(err){ msg.textContent = '密碼不對，再試一次'; pw.value = ''; pw.focus(); b.disabled = false; }
});
